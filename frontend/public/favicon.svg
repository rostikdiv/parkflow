<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <rect width="256" height="256" rx="64" fill="#e5e5e5" class="bg"/>
  <polygon points="40,110 220,30 140,210 120,130 40,110" fill="none" stroke="#000" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" class="fg"/>
  <style>
    @media (prefers-color-scheme: dark) {
      .bg { fill: #f8fafc; } /* slate-50 */
      .fg { stroke: #0f172a; } /* slate-900 */
    }
    @media (prefers-color-scheme: light) {
      .bg { fill: #0f172a; } /* slate-900 */
      .fg { stroke: #f8fafc; } /* slate-50 */
    }
  </style>
</svg>